plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

ext.targetConfig = [
    minecraftVersion          : '1.21.1',
    minecraftVersionLabel     : '1.21.1',
    minecraftVersionConstraint: '=1.21.1',
    fabricLoaderVersion       : '0.18.4',
    fabricApiVersion          : '0.116.9+1.21.1',
    jeiVersion                : '19.27.0.340',
    jeiApiArtifact            : 'jei-1.21.1-fabric-api',
    jeiRuntimeArtifact        : 'jei-1.21.1-fabric',
    javaVersion               : 21,
    remapping                 : true,
    excludedJava              : [],
    excludedResources         : []
]

apply from: rootProject.file('gradle/fabric-version.gradle')
