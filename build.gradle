plugins {
    id 'base'
}

group = 'com.github.alexscaves'

tasks.named('build') {
    dependsOn ':mc1211:build', ':mc121x:build', ':mc261:build'
}

tasks.register('build1211') {
    group = 'build'
    description = 'Build the Fabric 1.21.1 target.'
    dependsOn ':mc1211:build'
}

tasks.register('build121x') {
    group = 'build'
    description = 'Build the Fabric 1.21.11 target.'
    dependsOn ':mc121x:build'
}

tasks.register('build261') {
    group = 'build'
    description = 'Build the Fabric 26.1 target.'
    dependsOn ':mc261:build'
}
