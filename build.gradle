plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'com.github.alexscaves'

repositories {
    mavenLocal()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
}

base {
    archivesName = 'alexscaves'
}

def prismModsDirPath = providers.gradleProperty('prismModsDir')
    .orElse(providers.environmentVariable('PRISM_MODS_DIR'))

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

loom {
    accessWidenerPath = file('src/main/resources/alexscaves.accesswidener')
    mixin {
        defaultRefmapName = 'alexscaves.refmap.json'
    }
}

sourceSets {
    main {
        resources { srcDir 'src/generated/resources' }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.lwjgl:lwjgl:3.3.1'
        force 'org.lwjgl:lwjgl-glfw:3.3.1'
        force 'org.lwjgl:lwjgl-jemalloc:3.3.1'
        force 'org.lwjgl:lwjgl-openal:3.3.1'
        force 'org.lwjgl:lwjgl-opengl:3.3.1'
        force 'org.lwjgl:lwjgl-stb:3.3.1'
        force 'org.lwjgl:lwjgl-tinyfd:3.3.1'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Citadel has not been resolved to a Fabric artifact yet.
    // Keep the dependency surface explicit until that gate is closed.
    // compileOnly "group:artifact:${citadel_version}"
}

tasks.processResources {
    var replaceProperties = [
        minecraft_version    : minecraft_version,
        fabric_loader_version: fabric_loader_version,
        fabric_api_version   : fabric_api_version,
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_license          : mod_license,
        mod_version          : mod_version,
        mod_authors          : mod_authors,
        mod_description      : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : project.mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors
        ])
    }
}

tasks.register('deployToPrismMods') {
    onlyIf {
        prismModsDirPath.present && !prismModsDirPath.get().isBlank()
    }

    doLast {
        def source = tasks.named('remapJar').get().archiveFile.get().asFile.toPath()
        def prismModsDir = file(prismModsDirPath.get())
        def targetDir = prismModsDir.toPath()
        def target = targetDir.resolve(source.fileName.toString())
        def temp = targetDir.resolve("${source.fileName}.tmp")

        java.nio.file.Files.createDirectories(targetDir)
        java.nio.file.Files.copy(source, temp, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        try {
            java.nio.file.Files.move(
                temp,
                target,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                java.nio.file.StandardCopyOption.ATOMIC_MOVE
            )
        } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
            java.nio.file.Files.move(temp, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('remapJar') {
    finalizedBy tasks.named('deployToPrismMods')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
